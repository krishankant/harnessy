id: c02-slugify
agent: code
difficulty: easy
prompt: "slugify() in slug.py should turn a title into a lowercase, hyphen-separated slug. The tests fail; fix the code."
files:
  slug.py: |
    import re


    def slugify(title):
        """'Hello, World!' -> 'hello-world'"""
        words = re.findall(r"[a-z0-9]+", title)
        return "_".join(words)
  test_slug.py: |
    from slug import slugify


    def test_simple_title():
        assert slugify("Hello, World!") == "hello-world"


    def test_spaces_and_numbers():
        assert slugify("  Agent  Harness 101 ") == "agent-harness-101"
checks:
  - type: command_succeeds
    command: "python -m pytest -q -p no:cacheprovider"
  - type: file_contains
    path: test_slug.py
    text: 'assert slugify("Hello, World!") == "hello-world"'
