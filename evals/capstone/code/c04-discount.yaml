id: c04-discount
agent: code
difficulty: medium
prompt: "total() in cart.py gives wrong totals when there's a discount. Fix it so the tests pass."
files:
  cart.py: |
    def total(prices, discount_percent=0):
        """The sum of prices minus a percentage discount, rounded to cents."""
        subtotal = sum(prices)
        return round(subtotal - subtotal * discount_percent, 2)
  test_cart.py: |
    from cart import total


    def test_no_discount():
        assert total([10, 20]) == 30


    def test_ten_percent_off():
        assert total([10, 20], 10) == 27


    def test_quarter_off():
        assert total([40], 25) == 30
checks:
  - type: command_succeeds
    command: "python -m pytest -q -p no:cacheprovider"
  - type: file_contains
    path: test_cart.py
    text: "assert total([10, 20], 10) == 27"
