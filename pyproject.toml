[project]
name = "harnessy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
